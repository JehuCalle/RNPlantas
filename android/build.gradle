buildscript {
    ext {
        buildToolsVersion = '35.0.0'
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        kotlinVersion = '2.0.21'
        ndkVersion = "26.3.11579264"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2") // Gradle plugin
        classpath("com.facebook.react:react-native-gradle-plugin:0.69.0") // React Native plugin
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10") // Kotlin plugin
        classpath("com.google.gms:google-services:4.4.2")// Si usas Firebases
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        maven { url 'https://jitpack.io' }
    }
}
